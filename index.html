<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela El Ingeniero</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #050b18 0%, #0c2340 50%, #020813 100%);
            color: #333333;
            margin: 0;
            padding: 8px;
            min-height: 100vh;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0, 210, 255, 0.3);
            border: 3px solid #00d2ff;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 10px;
            background: #020813;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #00d2ff;
        }
        .logo-container img {
            max-width: 100%;
            height: auto;
            max-height: 130px;
            object-fit: contain;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #004085;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            background: #f8f9fa;
            color: #212529;
            box-sizing: border-box;
            font-size: 14px;
        }
        
        /* Estilos de la Tabla con Escudos */
        .quiniela-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
            background: #ffffff;
        }
        .quiniela-table th {
            background: #0c2340;
            color: #ffffff;
            font-size: 11px;
            padding: 6px 2px;
            text-align: center;
            border: 1px solid #00d2ff;
        }
        .quiniela-table td {
            border: 1px solid #d6d8db;
            padding: 5px 3px;
            text-align: center;
            font-size: 11px;
            vertical-align: middle;
        }
        .quiniela-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .num-col {
            font-weight: bold;
            background: #0c2340;
            color: white;
            width: 25px;
            border-radius: 3px;
        }
        .team-local {
            text-align: right;
            font-weight: bold;
            color: #212529;
            width: 32%;
            font-size: 11px;
            padding-right: 4px;
        }
        .team-visit {
            text-align: left;
            font-weight: bold;
            color: #212529;
            width: 32%;
            font-size: 11px;
            padding-left: 4px;
        }
        .team-cell {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .team-local .team-cell {
            justify-content: flex-end;
        }
        .team-visit .team-cell {
            justify-content: flex-start;
        }
        .team-cell img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }
        .options-cell {
            width: 9%;
            padding: 2px !important;
        }
        .options-cell label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            padding: 3px 1px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
            border: 1px solid #ced4da;
        }
        .options-cell input {
            display: none;
        }
        
        /* Colores de selección por opción */
        .opt-l input:checked + span { color: #6f42c1; }
        .opt-l:has(input:checked) { background: #f3e8ff; border-color: #6f42c1; }

        .opt-e input:checked + span { color: #d97706; }
        .opt-e:has(input:checked) { background: #fef3c7; border-color: #d97706; }

        .opt-v input:checked + span { color: #16a34a; }
        .opt-v:has(input:checked) { background: #dcfce7; border-color: #16a34a; }

        /* Sección de Total de Goles */
        .goles-box {
            background: linear-gradient(135deg, #0c2340 0%, #050b18 100%);
            border: 2px solid #00d2ff;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            margin-top: 10px;
        }
        .goles-box label {
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .goles-box input {
            width: 120px;
            padding: 8px;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
            border-radius: 6px;
            border: 2px solid #00d2ff;
            background: #ffffff;
            color: #0c2340;
        }

        .btn-submit {
            width: 100%;
            background: #25d366;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
        }
        .btn-submit:active {
            background: #1ebe5d;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Logotipo principal -->
    <div class="logo-container">
        <img src="logo1.jpg" alt="Quiniela El Ingeniero">
    </div>

    <div class="form-group">
        <label for="nombre">Tu Nombre / Participante:</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre completo">
    </div>

    <form id="quinielaForm">
        <table class="quiniela-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>LOCAL</th>
                    <th>L</th>
                    <th>E</th>
                    <th>V</th>
                    <th>VISITANTE</th>
                </tr>
            </thead>
            <tbody>
                <!-- Partido 1 -->
                <tr>
                    <td class="num-col">1</td>
                    <td class="team-local"><div class="team-cell"><span>Puebla</span><img src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Club_Puebla_2018.svg" alt="Puebla"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p1" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p1" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p1" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://upload.wikimedia.org/wikipedia/commons/3/3b/Club_Le%C3%B3n_%28logo%29.svg" alt="León"><span>León</span></div></td>
                </tr>
                <!-- Partido 2 -->
                <tr>
                    <td class="num-col">2</td>
                    <td class="team-local"><div class="team-cell"><span>Tigres UANL</span><img src="https://upload.wikimedia.org/wikipedia/commons/3/36/Tigres_UANL_logo.svg" alt="Tigres"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p2" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p2" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p2" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://upload.wikimedia.org/wikipedia/commons/4/45/Deportivo_Toluca_FC_logo.svg" alt="Toluca"><span>Toluca</span></div></td>
                </tr>
                <!-- Partido 3 -->
                <tr>
                    <td class="num-col">3</td>
                    <td class="team-local"><div class="team-cell"><span>Querétaro FC</span><img src="https://upload.wikimedia.org/wikipedia/commons/3/3b/Quer%C3%A9taro_FC_logo_%282022%29.svg" alt="Querétaro"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p3" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p3" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p3" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://upload.wikimedia.org/wikipedia/commons/9/9e/Atlante_FC_logo.svg" alt="Atlante"><span>Atlante (Cancún)</span></div></td>
                </tr>
                <!-- Partido 4 -->
                <tr>
                    <td class="num-col">4</td>
                    <td class="team-local"><div class="team-cell"><span>FC Juárez</span><img src="https://upload.wikimedia.org/wikipedia/commons/7/77/FC_Ju%C3%A1rez_logo.svg" alt="Juárez"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p4" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p4" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p4" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://upload.wikimedia.org/wikipedia/commons/2/23/Club_Tijuana_logo.svg" alt="Tijuana"><span>Club Tijuana</span></div></td>
                </tr>
                <!-- Partido 5 -->
                <tr>
                    <td class="num-col">5</td>
                    <td class="team-local"><div class="team-cell"><span>San Luis</span><img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Atl%C3%A9tico_de_San_Luis_logo.svg" alt="San Luis"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p5" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p5" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p5" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://upload.wikimedia.org/wikipedia/commons/0/07/Guadalajara_logo.svg" alt="Guadalajara"><span>Guadalajara</span></div></td>
                </tr>
                <!-- Partido 6 -->
                <tr>
                    <td class="num-col">6</td>
                    <td class="team-local"><div class="team-cell"><span>Club América</span><img src="https://upload.wikimedia.org/wikipedia/commons/a/a2/Club_Am%C3%A9rica_crest.svg" alt="América"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p6" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p6" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p6" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://upload.wikimedia.org/wikipedia/commons/0/02/CF_Monterrey_logo.svg" alt="Monterrey"><span>Monterrey</span></div></td>
                </tr>
                <!-- Partido 7 -->
                <tr>
                    <td class="num-col">7</td>
                    <td class="team-local"><div class="team-cell"><span>San Luis</span><img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Atl%C3%A9tico_de_San_Luis_logo.svg" alt="San Luis"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p7" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p7" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p7" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/Club_Santos_Laguna_logo.svg" alt="Santos"><span>Santos Laguna</span></div></td>
                </tr>
                <!-- Partido 8 -->
                <tr>
                    <td class="num-col">8</td>
                    <td class="team-local"><div class="team-cell"><span>Pachuca</span><img src="https://upload.wikimedia.org/wikipedia/commons/b/b2/CF_Pachuca_logo.svg" alt="Pachuca"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p8" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p8" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p8" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://upload.wikimedia.org/wikipedia/commons/f/f3/Club_Necaxa_logo.svg" alt="Necaxa"><span>Necaxa</span></div></td>
                </tr>
                <!-- Partido 9 -->
                <tr>
                    <td class="num-col">9</td>
                    <td class="team-local"><div class="team-cell"><span>Pumas UNAM</span><img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Pumas_UNAM_logo.svg" alt="Pumas"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p9" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p9" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p9" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://upload.wikimedia.org/wikipedia/commons/3/32/Cruz_Azul_fc_logo.svg" alt="Cruz Azul"><span>Cruz Azul</span></div></td>
                </tr>
            </tbody>
        </table>

        <!-- Caja de Total de Goles -->
        <div class="goles-box">
            <label for="goles">TOTAL DE GOLES</label>
            <input type="number" id="goles" placeholder="Ej. 25">
        </div>

        <button type="button" class="btn-submit" onclick="enviarWhatsApp()">Enviar Quiniela por WhatsApp</button>
    </form>
</div>

<script>
    function enviarWhatsApp() {
        const nombre = document.getElementById('nombre').value.trim();
        if (!nombre) {
            alert('Por favor ingresa tu nombre.');
            return;
        }

        const partidos = [
            "Puebla vs León",
            "Tigres UANL vs Toluca",
            "Querétaro FC vs Atlante (Cancún)",
            "FC Juárez vs Club Tijuana",
            "San Luis vs Guadalajara",
            "Club América vs Monterrey",
            "San Luis vs Santos Laguna",
            "Pachuca vs Necaxa",
            "Pumas UNAM vs Cruz Azul"
        ];

        let mensaje = `⚽ *QUINIELA EL INGENIERO* ⚽\n👤 *Participante:* ${nombre}\n\n`;

        for (let i = 1; i <= 9; i++) {
            const seleccion = document.querySelector(`input[name="p${i}"]:checked`);
            if (!seleccion) {
                alert(`Te falta seleccionar el pronóstico del partido ${i}: ${partidos[i-1]}`);
                return;
            }
            mensaje += `${i}. ${partidos[i-1]}: *${seleccion.value}*\n`;
        }

        const goles = document.getElementById('goles').value.trim();
        if (!goles) {
            alert('Por favor ingresa el total de goles para el desempate.');
            return;
        }

        mensaje += `\n🎯 *Total de Goles:* ${goles}`;

        const telefono = "6151165112";
        const url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
