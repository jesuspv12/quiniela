<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela El Ingeniero - Fecha FIFA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #050b18 0%, #0c2340 50%, #020813 100%);
            color: #333333;
            margin: 0;
            padding: 8px;
            min-height: 100vh;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0, 210, 255, 0.3);
            border: 3px solid #00d2ff;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 10px;
            background: #020813;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #00d2ff;
        }
        .logo-container img {
            max-width: 100%;
            height: auto;
            max-height: 130px;
            object-fit: contain;
        }
        .badge-fifa {
            background: #00d2ff;
            color: #020813;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #004085;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            background: #f8f9fa;
            color: #212529;
            box-sizing: border-box;
            font-size: 14px;
        }
        
        /* Estilos de la Tabla con Escudos */
        .quiniela-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
            background: #ffffff;
        }
        .quiniela-table th {
            background: #0c2340;
            color: #ffffff;
            font-size: 11px;
            padding: 6px 2px;
            text-align: center;
            border: 1px solid #00d2ff;
        }
        .quiniela-table td {
            border: 1px solid #d6d8db;
            padding: 6px 4px;
            text-align: center;
            font-size: 11px;
            vertical-align: middle;
        }
        .quiniela-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .num-col {
            font-weight: bold;
            background: #0c2340;
            color: white;
            width: 25px;
            border-radius: 3px;
        }
        .team-local {
            text-align: right;
            font-weight: bold;
            color: #212529;
            width: 32%;
            font-size: 11px;
            padding-right: 4px;
        }
        .team-visit {
            text-align: left;
            font-weight: bold;
            color: #212529;
            width: 32%;
            font-size: 11px;
            padding-left: 4px;
        }
        .team-cell {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .team-local .team-cell {
            justify-content: flex-end;
        }
        .team-visit .team-cell {
            justify-content: flex-start;
        }
        .team-cell img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            border-radius: 50%;
            border: 1px solid #ccc;
        }
        .options-cell {
            width: 8% !important;
            padding: 2px !important;
        }
        .options-cell label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            padding: 4px 2px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid #ced4da;
        }
        .options-cell input {
            display: none;
        }
        
        /* Colores de selección */
        .opt-l input:checked + span { color: #6f42c1; }
        .opt-l:has(input:checked) { background: #f3e8ff; border-color: #6f42c1; }

        .opt-e input:checked + span { color: #d97706; }
        .opt-e:has(input:checked) { background: #fef3c7; border-color: #d97706; }

        .opt-v input:checked + span { color: #16a34a; }
        .opt-v:has(input:checked) { background: #dcfce7; border-color: #16a34a; }

        /* Sección Total de Goles */
        .goles-box {
            background: linear-gradient(135deg, #0c2340 0%, #050b18 100%);
            border: 2px solid #00d2ff;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            margin-top: 10px;
        }
        .goles-box label {
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .goles-box input {
            width: 120px;
            padding: 8px;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
            border-radius: 6px;
            border: 2px solid #00d2ff;
            background: #ffffff;
            color: #0c2340;
        }

        .btn-submit {
            width: 100%;
            background: #25d366;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
        }
        .btn-submit:active {
            background: #1ebe5d;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="logo1.jpg" alt="Quiniela El Ingeniero">
    </div>

    <div style="text-align: center;">
        <span class="badge-fifa">🌍 Edición Especial Fecha FIFA</span>
    </div>

    <div class="form-group">
        <label for="nombre">Tu Nombre / Participante:</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre completo">
    </div>

    <form id="quinielaForm">
        <table class="quiniela-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>LOCAL</th>
                    <th>L</th>
                    <th>E</th>
                    <th>V</th>
                    <th>VISITANTE</th>
                </tr>
            </thead>
            <tbody>
                <!-- Partido 1 -->
                <tr>
                    <td class="num-col">1</td>
                    <td class="team-local"><div class="team-cell"><span>Argentina</span><img src="https://flagcdn.com/w40/ar.png" alt="Argentina"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p1" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p1" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p1" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://flagcdn.com/w40/br.png" alt="Brasil"><span>Brasil</span></div></td>
                </tr>
                <!-- Partido 2 -->
                <tr>
                    <td class="num-col">2</td>
                    <td class="team-local"><div class="team-cell"><span>Alemania</span><img src="https://flagcdn.com/w40/de.png" alt="Alemania"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p2" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p2" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p2" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://flagcdn.com/w40/nl.png" alt="Países Bajos"><span>Países Bajos</span></div></td>
                </tr>
                <!-- Partido 3 -->
                <tr>
                    <td class="num-col">3</td>
                    <td class="team-local"><div class="team-cell"><span>España</span><img src="https://flagcdn.com/w40/es.png" alt="España"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p3" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p3" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p3" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://flagcdn.com/w40/pt.png" alt="Portugal"><span>Portugal</span></div></td>
                </tr>
                <!-- Partido 4 -->
                <tr>
                    <td class="num-col">4</td>
                    <td class="team-local"><div class="team-cell"><span>Francia</span><img src="https://flagcdn.com/w40/fr.png" alt="Francia"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p4" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p4" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p4" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://flagcdn.com/w40/it.png" alt="Italia"><span>Italia</span></div></td>
                </tr>
                <!-- Partido 5 -->
                <tr>
                    <td class="num-col">5</td>
                    <td class="team-local"><div class="team-cell"><span>Inglaterra</span><img src="https://flagcdn.com/w40/gb-eng.png" alt="Inglaterra"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p5" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p5" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p5" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://flagcdn.com/w40/de.png" alt="Alemania"><span>Alemania</span></div></td>
                </tr>
                <!-- Partido 6 -->
                <tr>
                    <td class="num-col">6</td>
                    <td class="team-local"><div class="team-cell"><span>Uruguay</span><img src="https://flagcdn.com/w40/uy.png" alt="Uruguay"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p6" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p6" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p6" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://flagcdn.com/w40/co.png" alt="Colombia"><span>Colombia</span></div></td>
                </tr>
                <!-- Partido 7 -->
                <tr>
                    <td class="num-col">7</td>
                    <td class="team-local"><div class="team-cell"><span>México</span><img src="https://flagcdn.com/w40/mx.png" alt="México"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p7" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p7" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p7" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://flagcdn.com/w40/us.png" alt="Estados Unidos"><span>Estados Unidos</span></div></td>
                </tr>
                <!-- Partido 8 -->
                <tr>
                    <td class="num-col">8</td>
                    <td class="team-local"><div class="team-cell"><span>Bélgica</span><img src="https://flagcdn.com/w40/be.png" alt="Bélgica"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p8" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p8" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p8" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://flagcdn.com/w40/hr.png" alt="Croacia"><span>Croacia</span></div></td>
                </tr>
                <!-- Partido 9 -->
                <tr>
                    <td class="num-col">9</td>
                    <td class="team-local"><div class="team-cell"><span>Japón</span><img src="https://flagcdn.com/w40/jp.png" alt="Japón"></div></td>
                    <td class="options-cell"><label class="opt-l"><input type="radio" name="p9" value="Local"><span>L</span></label></td>
                    <td class="options-cell"><label class="opt-e"><input type="radio" name="p9" value="Empate"><span>E</span></label></td>
                    <td class="options-cell"><label class="opt-v"><input type="radio" name="p9" value="Visitante"><span>V</span></label></td>
                    <td class="team-visit"><div class="team-cell"><img src="https://flagcdn.com/w40/kr.png" alt="Corea del Sur"><span>Corea del Sur</span></div></td>
                </tr>
            </tbody>
        </table>

        <!-- Caja de Total de Goles -->
        <div class="goles-box">
            <label for="goles">TOTAL DE GOLES</label>
            <input type="number" id="goles" placeholder="Ej. 25">
        </div>

        <button type="button" class="btn-submit" onclick="enviarWhatsApp()">Enviar Quiniela por WhatsApp</button>
    </form>
</div>

<script>
    function enviarWhatsApp() {
        const nombre = document.getElementById('nombre').value.trim();
        if (!nombre) {
            alert('Por favor ingresa tu nombre.');
            return;
        }

        const partidos = [
            "Argentina vs Brasil",
            "Alemania vs Países Bajos",
            "España vs Portugal",
            "Francia vs Italia",
            "Inglaterra vs Alemania",
            "Uruguay vs Colombia",
            "México vs Estados Unidos",
            "Bélgica vs Croacia",
            "Japón vs Corea del Sur"
        ];

        let mensaje = `🌍 *QUINIELA EL INGENIERO (ESPECIAL FECHA FIFA)* 🌍\n👤 *Participante:* ${nombre}\n\n`;

        for (let i = 1; i <= 9; i++) {
            const seleccion = document.querySelector(`input[name="p${i}"]:checked`);
            if (!seleccion) {
                alert(`Te falta seleccionar el pronóstico del partido ${i}: ${partidos[i-1]}`);
                return;
            }
            mensaje += `${i}. ${partidos[i-1]}: *${seleccion.value}*\n`;
        }

        const goles = document.getElementById('goles').value.trim();
        if (!goles) {
            alert('Por favor ingresa el total de goles para el desempate.');
            return;
        }

        mensaje += `\n🎯 *Total de Goles:* ${goles}`;

        const telefono = "6151165112";
        const url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
