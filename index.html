<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela El Ingeniero</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid #00d2ff;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-container img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0,255,204,0.4);
        }
        h1 {
            text-align: center;
            color: #00ffcc;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .match-card {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        .match-title {
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .options {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }
        .options label {
            flex: 1;
            background: #333;
            padding: 8px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            border: 1px solid #444;
            transition: all 0.2s;
        }
        .options input {
            display: none;
        }
        .options input:checked + span {
            color: #00ffcc;
            font-weight: bold;
        }
        .options label:has(input:checked) {
            background: #004d40;
            border-color: #00ffcc;
        }
        .form-group {
            margin-top: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #00ffcc;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-submit {
            width: 100%;
            background: #25d366;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            text-align: center;
        }
        .btn-submit:active {
            background: #1ebe5d;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Logotipo Oficial -->
    <div class="logo-container">
        <img src="logo.jpg" alt="Logo Quiniela El Ingeniero">
    </div>

    <h1>Quiniela El Ingeniero</h1>
    <div class="subtitle">Selecciona tus pronósticos de la jornada</div>

    <div class="form-group">
        <label for="nombre">Tu Nombre / Participante:</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre completo">
    </div>

    <form id="quinielaForm">
        <!-- Partido 1 -->
        <div class="match-card">
            <div class="match-title">Puebla vs Club León</div>
            <div class="options">
                <label><input type="radio" name="p1" value="Local"><span>Local (L)</span></label>
                <label><input type="radio" name="p1" value="Empate"><span>Empate (E)</span></label>
                <label><input type="radio" name="p1" value="Visitante"><span>Visitante (V)</span></label>
            </div>
        </div>

        <!-- Partido 2 -->
        <div class="match-card">
            <div class="match-title">Tigres UANL vs Toluca</div>
            <div class="options">
                <label><input type="radio" name="p2" value="Local"><span>Local (L)</span></label>
                <label><input type="radio" name="p2" value="Empate"><span>Empate (E)</span></label>
                <label><input type="radio" name="p2" value="Visitante"><span>Visitante (V)</span></label>
            </div>
        </div>

        <!-- Partido 3 -->
        <div class="match-card">
            <div class="match-title">Querétaro FC vs Atlante (Cancún)</div>
            <div class="options">
                <label><input type="radio" name="p3" value="Local"><span>Local (L)</span></label>
                <label><input type="radio" name="p3" value="Empate"><span>Empate (E)</span></label>
                <label><input type="radio" name="p3" value="Visitante"><span>Visitante (V)</span></label>
            </div>
        </div>

        <!-- Partido 4 -->
        <div class="match-card">
            <div class="match-title">FC Juárez vs Club Tijuana</div>
            <div class="options">
                <label><input type="radio" name="p4" value="Local"><span>Local (L)</span></label>
                <label><input type="radio" name="p4" value="Empate"><span>Empate (E)</span></label>
                <label><input type="radio" name="p4" value="Visitante"><span>Visitante (V)</span></label>
            </div>
        </div>

        <!-- Partido 5 -->
        <div class="match-card">
            <div class="match-title">Atlas vs Guadalajara</div>
            <div class="options">
                <label><input type="radio" name="p5" value="Local"><span>Local (L)</span></label>
                <label><input type="radio" name="p5" value="Empate"><span>Empate (E)</span></label>
                <label><input type="radio" name="p5" value="Visitante"><span>Visitante (V)</span></label>
            </div>
        </div>

        <!-- Partido 6 -->
        <div class="match-card">
            <div class="match-title">Club América vs Monterrey</div>
            <div class="options">
                <label><input type="radio" name="p6" value="Local"><span>Local (L)</span></label>
                <label><input type="radio" name="p6" value="Empate"><span>Empate (E)</span></label>
                <label><input type="radio" name="p6" value="Visitante"><span>Visitante (V)</span></label>
            </div>
        </div>

        <!-- Partido 7 -->
        <div class="match-card">
            <div class="match-title">Atlético San Luis vs Santos Laguna</div>
            <div class="options">
                <label><input type="radio" name="p7" value="Local"><span>Local (L)</span></label>
                <label><input type="radio" name="p7" value="Empate"><span>Empate (E)</span></label>
                <label><input type="radio" name="p7" value="Visitante"><span>Visitante (V)</span></label>
            </div>
        </div>

        <!-- Partido 8 -->
        <div class="match-card">
            <div class="match-title">Pachuca vs Necaxa</div>
            <div class="options">
                <label><input type="radio" name="p8" value="Local"><span>Local (L)</span></label>
                <label><input type="radio" name="p8" value="Empate"><span>Empate (E)</span></label>
                <label><input type="radio" name="p8" value="Visitante"><span>Visitante (V)</span></label>
            </div>
        </div>

        <!-- Partido 9 -->
        <div class="match-card">
            <div class="match-title">Pumas UNAM vs Cruz Azul</div>
            <div class="options">
                <label><input type="radio" name="p9" value="Local"><span>Local (L)</span></label>
                <label><input type="radio" name="p9" value="Empate"><span>Empate (E)</span></label>
                <label><input type="radio" name="p9" value="Visitante"><span>Visitante (V)</span></label>
            </div>
        </div>

        <!-- Desempate -->
        <div class="form-group">
            <label for="goles">Total de Goles en la Jornada (Desempate):</label>
            <input type="number" id="goles" placeholder="Ej. 22">
        </div>

        <button type="button" class="btn-submit" onclick="enviarWhatsApp()">Enviar Quiniela por WhatsApp</button>
    </form>
</div>

<script>
    function enviarWhatsApp() {
        const nombre = document.getElementById('nombre').value.trim();
        if (!nombre) {
            alert('Por favor ingresa tu nombre.');
            return;
        }

        const partidos = [
            "Puebla vs Club León",
            "Tigres UANL vs Toluca",
            "Querétaro FC vs Atlante",
            "FC Juárez vs Club Tijuana",
            "Atlas vs Guadalajara",
            "Club América vs Monterrey",
            "Atlético San Luis vs Santos Laguna",
            "Pachuca vs Necaxa",
            "Pumas UNAM vs Cruz Azul"
        ];

        let mensaje = `⚽ *QUINELA EL INGENIERO* ⚽\n👤 *Participante:* ${nombre}\n\n`;

        for (let i = 1; i <= 9; i++) {
            const seleccion = document.querySelector(`input[name="p${i}"]:checked`);
            if (!seleccion) {
                alert(`Te falta seleccionar el pronóstico del partido ${i}: ${partidos[i-1]}`);
                return;
            }
            mensaje += `${i}. ${partidos[i-1]}: *${seleccion.value}*\n`;
        }

        const goles = document.getElementById('goles').value.trim();
        if (!goles) {
            alert('Por favor ingresa el total de goles para el desempate.');
            return;
        }

        mensaje += `\n🎯 *Total de Goles:* ${goles}`;

        const telefono = "6151165112";
        const url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
