<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela El Ingeniero</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #111d2a;
            border: 4px solid #00d2ff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }
        h1 {
            text-align: center;
            color: #ffcc00;
            text-shadow: 2px 2px #000;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .user-info {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .user-info label {
            font-weight: bold;
            color: #00d2ff;
        }
        .user-info input {
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }
        .match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334e68;
        }
        .match-num {
            background: #00d2ff;
            color: #000;
            font-weight: bold;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .team {
            flex: 1;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
        .team.local { text-align: left; padding-left: 10px; }
        .team.visitor { text-align: right; padding-right: 10px; }
        
        .options {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .options label {
            cursor: pointer;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            color: #aaa;
        }
        .options input {
            cursor: pointer;
            margin-top: 3px;
        }
        .total-goles {
            margin-top: 20px;
            background: rgba(0, 210, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 2px dashed #00d2ff;
        }
        .total-goles input {
            padding: 8px;
            width: 100px;
            text-align: center;
            font-size: 18px;
            border-radius: 5px;
            border: none;
            margin-top: 5px;
        }
        .btn-enviar {
            width: 100%;
            background: #25d366;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .btn-enviar:hover {
            background: #1ebe5d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚽ QUINIELA EL INGENIERO ⚽</h1>
    
    <div class="user-info">
        <label for="nombre">Tu Nombre / Participante:</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre completo" required>
    </div>

    <form id="quinielaForm">
        <!-- Partido 1 -->
        <div class="match-row">
            <div class="match-num">1</div>
            <div class="team local">Atlante</div>
            <div class="options">
                <label>L<input type="radio" name="p1" value="L" required></label>
                <label>E<input type="radio" name="p1" value="E"></label>
                <label>V<input type="radio" name="p1" value="V"></label>
            </div>
            <div class="team visitor">Monterrey</div>
        </div>

        <!-- Partido 2 -->
        <div class="match-row">
            <div class="match-num">2</div>
            <div class="team local">Tijuana</div>
            <div class="options">
                <label>L<input type="radio" name="p2" value="L" required></label>
                <label>E<input type="radio" name="p2" value="E"></label>
                <label>V<input type="radio" name="p2" value="V"></label>
            </div>
            <div class="team visitor">Atlas</div>
        </div>

        <!-- Partido 3 -->
        <div class="match-row">
            <div class="match-num">3</div>
            <div class="team local">Cruz Azul</div>
            <div class="options">
                <label>L<input type="radio" name="p3" value="L" required></label>
                <label>E<input type="radio" name="p3" value="E"></label>
                <label>V<input type="radio" name="p3" value="V"></label>
            </div>
            <div class="team visitor">Toluca</div>
        </div>

        <!-- Partido 4 -->
        <div class="match-row">
            <div class="match-num">4</div>
            <div class="team local">Guadalajara</div>
            <div class="options">
                <label>L<input type="radio" name="p4" value="L" required></label>
                <label>E<input type="radio" name="p4" value="E"></label>
                <label>V<input type="radio" name="p4" value="V"></label>
            </div>
            <div class="team visitor">Querétaro</div>
        </div>

        <!-- Partido 5 -->
        <div class="match-row">
            <div class="match-num">5</div>
            <div class="team local">Santos Laguna</div>
            <div class="options">
                <label>L<input type="radio" name="p5" value="L" required></label>
                <label>E<input type="radio" name="p5" value="E"></label>
                <label>V<input type="radio" name="p5" value="V"></label>
            </div>
            <div class="team visitor">Pachuca</div>
        </div>

        <!-- Partido 6 -->
        <div class="match-row">
            <div class="match-num">6</div>
            <div class="team local">Tigres UANL</div>
            <div class="options">
                <label>L<input type="radio" name="p6" value="L" required></label>
                <label>E<input type="radio" name="p6" value="E"></label>
                <label>V<input type="radio" name="p6" value="V"></label>
            </div>
            <div class="team visitor">Puebla</div>
        </div>

        <!-- Partido 7 -->
        <div class="match-row">
            <div class="match-num">7</div>
            <div class="team local">Pumas UNAM</div>
            <div class="options">
                <label>L<input type="radio" name="p7" value="L" required></label>
                <label>E<input type="radio" name="p7" value="E"></label>
                <label>V<input type="radio" name="p7" value="V"></label>
            </div>
            <div class="team visitor">Atlético de San Luis</div>
        </div>

        <!-- Partido 8 -->
        <div class="match-row">
            <div class="match-num">8</div>
            <div class="team local">León</div>
            <div class="options">
                <label>L<input type="radio" name="p8" value="L" required></label>
                <label>E<input type="radio" name="p8" value="E"></label>
                <label>V<input type="radio" name="p8" value="V"></label>
            </div>
            <div class="team visitor">FC Juárez</div>
        </div>

        <!-- Partido 9 -->
        <div class="match-row">
            <div class="match-num">9</div>
            <div class="team local">Necaxa</div>
            <div class="options">
                <label>L<input type="radio" name="p9" value="L" required></label>
                <label>E<input type="radio" name="p9" value="E"></label>
                <label>V<input type="radio" name="p9" value="V"></label>
            </div>
            <div class="team visitor">América</div>
        </div>

        <!-- Total de Goles -->
        <div class="total-goles">
            <label for="goles"><strong>TOTAL DE GOLES (Desempate):</strong></label><br>
            <input type="number" id="goles" min="0" placeholder="Ej. 25" required>
        </div>

        <button type="button" class="btn-enviar" onclick="enviarQuiniela()">Enviar Quiniela por WhatsApp</button>
    </form>
</div>

<script>
    function enviarQuiniela() {
        const nombre = document.getElementById('nombre').value.trim();
        const goles = document.getElementById('goles').value.trim();

        if (!nombre) {
            alert('Por favor, ingresa tu nombre antes de enviar la quiniela.');
            document.getElementById('nombre').focus();
            return;
        }

        // Validar que todos los partidos tengan selección
        let resultados = [];
        for (let i = 1; i <= 9; i++) {
            const seleccion = document.querySelector(`input[name="p${i}"]:checked`);
            if (!seleccion) {
                alert(`Te falta seleccionar el resultado del partido #${i}`);
                return;
            }
            resultados.push(`P${i}: *${seleccion.value}*`);
        }

        if (!goles) {
            alert('Por favor, ingresa el pronóstico para el Total de Goles.');
            document.getElementById('goles').focus();
            return;
        }

        // Tu número de WhatsApp configurado (521 + 6151165112)
        const tuNumeroWhatsApp = "5216151165112"; 

        let mensaje = `*¡Nueva Quiniela Recibida!*%0A`;
        mensaje += `👤 *Participante:* ${encodeURIComponent(nombre)}%0A%0A`;
        mensaje += `📋 *Pronósticos:*%0A${resultados.join(' | ')}%0A%0A`;
        mensaje += `⚽ *Total de Goles:* *${goles}*`;

        const url = `https://wa.me/${tuNumeroWhatsApp}?text=${mensaje}`;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
